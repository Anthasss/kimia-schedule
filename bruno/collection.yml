opencollection: "1.0.0"
bundled: true

info:
  name: schedule-maker timing
  version: 1.0.0
  summary: Compare batch save vs per-slot save latency on the Neon testing branch

config:
  environments:
    - name: Local
      variables:
        - name: baseUrl
          value: http://localhost:3000

request:
  headers:
    - name: Content-Type
      value: application/json

items:
  - info:
      name: 1. Health (baseline)
      type: http
      seq: 1
    http:
      method: GET
      url: "{{baseUrl}}/api/health"
    runtime:
      scripts:
        - type: after-response
          code: |
            console.log("[health] " + response.time + " ms | status " + response.status);
      assertions:
        - expression: response.status
          operator: eq
          value: "200"

