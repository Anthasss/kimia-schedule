name: schedule-maker timing
version: 1.1.0
description: Latency comparison collection for the kimia-schedule-maker API, updated for the normalized schema (schedules table, course_class_lecturers join, slim schedule_slots). Items 1-5 are the latency benchmark against seeded rows; items 6-12 cover the redesigned endpoints.

items:
  - info:
      name: 1. Health check
      type: http
      seq: 1
    http:
      method: GET
      url: "{{baseUrl}}/api/health"
    runtime:
      scripts:
        - type: after-response
          code: |
            console.log("[health] " + response.time + " ms | status " + response.status);
      assertions:
        - expression: response.status
          operator: eq
          value: "200"

